<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Torneo de IA · CIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{
  --bg0:#0b0518;--bg1:#040109;--magenta:#ff2d9b;--magenta2:#ff6ec2;--cyan:#2ff0ff;--violet:#a78bfa;
  --gold:#ffcf4d;--silver:#dbe2f0;--bronze:#f0975a;--green:#3ef0a8;
  --ink:#f6f2ff;--mut:#a99cd6;--faint:#6f639c;--line:rgba(169,156,214,.16);--glass:rgba(255,255,255,.04);--glass2:rgba(255,255,255,.075);
  --holo:conic-gradient(from var(--ang,0deg),var(--magenta),var(--violet),var(--cyan),var(--magenta));
  --disp:'Syne',system-ui,sans-serif;--ui:'Space Grotesk',system-ui,sans-serif;--mono:'Space Mono',ui-monospace,monospace;
  --r:18px;--r-lg:26px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--ui);color:var(--ink);background:var(--bg1);overflow-x:hidden}
.bg-base{position:fixed;inset:0;z-index:-3;background:radial-gradient(1100px 640px at 8% -8%,rgba(255,45,155,.22),transparent 58%),radial-gradient(1000px 640px at 100% 4%,rgba(47,240,255,.16),transparent 55%),radial-gradient(900px 900px at 82% 118%,rgba(167,139,250,.20),transparent 60%),linear-gradient(165deg,var(--bg0),var(--bg1) 72%)}
.bg-grid{position:fixed;left:-10%;right:-10%;bottom:-6%;height:56vh;z-index:-2;pointer-events:none;background-image:linear-gradient(rgba(47,240,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(255,45,155,.14) 1px,transparent 1px);background-size:64px 64px;transform:perspective(520px) rotateX(64deg);transform-origin:bottom center;-webkit-mask:linear-gradient(to top,#000 8%,transparent 82%);mask:linear-gradient(to top,#000 8%,transparent 82%);opacity:.55;animation:gridflow 8s linear infinite}
@keyframes gridflow{to{background-position:0 64px,64px 0}}
.scan{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:.4;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px)}
.hud{position:fixed;inset:16px;z-index:42;pointer-events:none}
.hud i{position:absolute;width:34px;height:34px;border:2px solid rgba(47,240,255,.5);filter:drop-shadow(0 0 6px rgba(47,240,255,.4))}
.hud .tl{top:0;left:0;border-right:0;border-bottom:0}.hud .tr{top:0;right:0;border-left:0;border-bottom:0}
.hud .bl{bottom:0;left:0;border-right:0;border-top:0}.hud .br{bottom:0;right:0;border-left:0;border-top:0}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#fx{position:fixed;inset:0;z-index:75;pointer-events:none;display:grid;place-items:center;padding:20px}
#app{position:relative;z-index:2;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.holo{position:relative;z-index:0}
.holo::before{content:"";position:absolute;inset:-1.5px;border-radius:inherit;padding:1.5px;background:var(--holo);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;animation:spin 5s linear infinite;z-index:-1;filter:drop-shadow(0 0 10px rgba(255,45,155,.35))}
@keyframes spin{to{--ang:360deg}}
.topbar{display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap;padding:12px clamp(14px,3vw,34px);border-bottom:1px solid var(--line);background:rgba(6,2,14,.55);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,var(--magenta),var(--violet));box-shadow:0 0 22px rgba(255,45,155,.55)}
.brand b{font-family:var(--disp);font-weight:800;font-size:clamp(14px,1.7vw,18px);letter-spacing:1px;display:block}
.brand .sfx-mono{font-family:var(--mono);color:var(--cyan);font-size:10px;letter-spacing:2px;opacity:.85}
.hudinfo{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:1px}
.hudinfo .live{color:var(--green);display:flex;align-items:center;gap:6px}
.hudinfo .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 1.4s ease-in-out infinite}
.hudinfo .dot.off{background:var(--faint);box-shadow:none;animation:none}
@keyframes pulse{50%{opacity:.35}}
.hudinfo b{color:var(--ink)}
.nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-left:auto}
.seg{display:inline-flex;background:var(--glass);border:1px solid var(--line);border-radius:13px;padding:4px;gap:2px}
.seg button{font-family:var(--ui);font-weight:600;font-size:13px;color:var(--mut);background:transparent;border:0;padding:8px 13px;border-radius:9px;cursor:pointer;transition:.16s;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:linear-gradient(135deg,var(--magenta),var(--violet));color:#fff;box-shadow:0 0 16px rgba(255,45,155,.45)}
.iconbtn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--glass);color:var(--mut);font-size:16px;cursor:pointer;transition:.16s;display:grid;place-items:center}
.iconbtn:hover{color:#fff;border-color:var(--cyan);box-shadow:0 0 14px rgba(47,240,255,.35)}
.stage{flex:1;display:flex;flex-direction:column;padding:clamp(16px,3vw,42px);gap:clamp(14px,2vw,24px);animation:stagein .45s ease}
@keyframes stagein{from{opacity:0;transform:translateY(10px)}}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px}
.btn{font-family:var(--ui);font-weight:700;font-size:15px;border:0;border-radius:13px;padding:13px 22px;cursor:pointer;transition:.16s;display:inline-flex;align-items:center;gap:10px;line-height:1;position:relative;overflow:hidden}
.btn:active{transform:translateY(1px)}
.btn::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transition:.5s}
.btn:hover::after{left:130%}
.btn-primary{background:linear-gradient(135deg,var(--magenta),var(--violet));color:#fff;box-shadow:0 0 26px rgba(255,45,155,.45)}
.btn-cyan{background:linear-gradient(135deg,var(--cyan),#3b82f6);color:#04121a;box-shadow:0 0 26px rgba(47,240,255,.4)}
.btn-ghost{background:var(--glass);color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--cyan);background:var(--glass2)}
.btn-lg{font-size:clamp(16px,2vw,20px);padding:17px 34px;border-radius:16px}
.btn[disabled]{opacity:.38;cursor:not-allowed;filter:grayscale(.4)}.btn[disabled]::after{display:none}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:10px}
.btn-big{font-size:clamp(20px,3vw,30px);padding:22px 30px;border-radius:20px;font-family:var(--disp);font-weight:800}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);backdrop-filter:blur(8px)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:999px;font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:2px;background:var(--glass);border:1px solid var(--line);color:var(--mut)}
.pill.hot{background:linear-gradient(135deg,rgba(255,45,155,.25),rgba(167,139,250,.2));border-color:rgba(255,45,155,.45);color:#fff;box-shadow:0 0 20px rgba(255,45,155,.25)}
.pill::before{content:"[ ";color:var(--cyan)}.pill::after{content:" ]";color:var(--cyan)}
.kbd{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:1px}
.hero-title{font-family:var(--disp);font-weight:800;line-height:.9;letter-spacing:-1px;font-size:clamp(46px,12vw,150px);background:linear-gradient(100deg,#fff 6%,var(--magenta2) 34%,var(--cyan) 64%,#fff 96%);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 44px rgba(255,45,155,.4));animation:shimmer 6s linear infinite}
@keyframes shimmer{to{background-position:220% center}}
.hero-sub{color:var(--mut);font-size:clamp(14px,1.8vw,20px);max-width:46ch;line-height:1.55}
.rounds3{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.rcard{width:min(258px,80vw);text-align:left;padding:20px 22px;border-radius:var(--r)}
.rcard .rn{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--cyan);letter-spacing:2px}
.rcard h4{font-family:var(--disp);margin:10px 0 6px;font-size:20px;font-weight:700}
.rcard p{margin:0;color:var(--mut);font-size:13.5px;line-height:1.55}
label.fld{display:block;font-family:var(--mono);font-size:11px;color:var(--cyan);letter-spacing:1.5px;margin:0 0 8px}
.input{width:100%;font-family:var(--ui);font-size:16px;color:var(--ink);background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:13px;padding:14px 16px;outline:none;transition:.16s}
.input:focus{border-color:var(--magenta);box-shadow:0 0 0 3px rgba(255,45,155,.16)}
.panel{padding:clamp(18px,2.2vw,28px);border-radius:var(--r-lg)}
.panel h3{font-family:var(--disp);font-weight:700;font-size:21px;margin:0 0 4px}
.panel .hint{color:var(--mut);font-size:13.5px;margin:0 0 18px;line-height:1.5}
.photobox{margin:16px auto;aspect-ratio:1/1;width:100%;max-width:240px;border-radius:20px;overflow:hidden;position:relative;background:rgba(0,0,0,.32);border:1px dashed var(--line);display:grid;place-items:center}
.photobox video,.photobox img{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.photobox img.up{transform:none}
.photobox .ph{color:var(--faint);font-size:13px;text-align:center;padding:20px}
.photobox .ph .big{font-size:40px;display:block;margin-bottom:8px}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.avatar{width:76px;height:76px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:34px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.16)}
.avatar img{width:100%;height:100%;object-fit:cover}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tcard{padding:16px;border-radius:var(--r);text-align:center;position:relative;animation:jackin .45s cubic-bezier(.2,1.3,.35,1)}
@keyframes jackin{from{opacity:0;transform:translateY(10px) scale(.82);filter:blur(4px)}}
.tcard .nm{margin-top:10px;font-weight:700;font-size:15px;word-break:break-word}
.empty{grid-column:1/-1;color:var(--faint);text-align:center;padding:30px;font-family:var(--mono);font-size:13px;letter-spacing:1px}
.linkbox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;width:100%;max-width:640px;margin-inline:auto}
.linkbox input{flex:1;min-width:220px;font-family:var(--mono);font-size:13px}
.round-head{text-align:center}
.round-head h2{font-family:var(--disp);font-weight:800;font-size:clamp(30px,5.4vw,64px);margin:12px 0 6px;letter-spacing:-.5px;text-shadow:0 0 40px rgba(255,45,155,.3)}
.round-head p{color:var(--mut);margin:0;font-size:clamp(14px,1.7vw,18px);max-width:62ch;margin-inline:auto;line-height:1.5}
.qwrap{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%}
.qimg{width:100%;max-width:640px;aspect-ratio:16/10;border-radius:22px;overflow:hidden;background:rgba(0,0,0,.4);border:1px solid var(--line);display:grid;place-items:center;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.qimg img{width:100%;height:100%;object-fit:contain;background:#000}
.qimg .noimg{color:var(--faint);text-align:center;padding:24px;font-size:14px}
.qimg .qn{position:absolute;top:14px;left:14px;background:rgba(0,0,0,.55);border:1px solid var(--line);padding:6px 14px;border-radius:999px;font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:1px}
.reveal{font-family:var(--disp);font-weight:800;font-size:clamp(34px,7vw,74px);letter-spacing:1px;animation:reveal .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes reveal{0%{opacity:0;transform:scale(.5);filter:blur(8px)}60%{transform:scale(1.12)}}
.reveal.real{color:var(--cyan);text-shadow:0 0 50px rgba(47,240,255,.6)}
.reveal.ia{color:var(--magenta2);text-shadow:0 0 50px rgba(255,45,155,.6)}
.pista{color:var(--mut);font-size:15px;max-width:56ch;text-align:center}
.target{width:100%;max-width:520px;aspect-ratio:1/1;border-radius:22px;overflow:hidden;background:rgba(0,0,0,.4);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.target img{width:100%;height:100%;object-fit:contain;background:#000}
.target .noimg{color:var(--faint);text-align:center;padding:24px;font-size:14px}
.brief{max-width:720px;width:100%;padding:24px 26px;border-radius:var(--r-lg);font-size:16px;line-height:1.65;white-space:pre-wrap}
.brief .lbl{font-family:var(--mono);font-weight:700;color:var(--cyan);font-size:12px;letter-spacing:2px;display:block;margin-bottom:10px}
.vote2{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:520px}
.votebtn{border:2px solid var(--line);background:var(--glass);color:var(--ink);border-radius:20px;padding:26px 14px;font-family:var(--disp);font-weight:800;font-size:clamp(22px,5vw,34px);cursor:pointer;transition:.16s;display:flex;flex-direction:column;align-items:center;gap:8px}
.votebtn .ic{font-size:40px}
.votebtn.real:hover,.votebtn.real.sel{border-color:var(--cyan);box-shadow:0 0 26px rgba(47,240,255,.4);background:rgba(47,240,255,.1)}
.votebtn.fake:hover,.votebtn.fake.sel{border-color:var(--magenta);box-shadow:0 0 26px rgba(255,45,155,.4);background:rgba(255,45,155,.1)}
.votebtn[disabled]{opacity:.5;cursor:default}
.tag{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;font-weight:700;font-family:var(--mono);letter-spacing:1px;font-size:14px}
.tag.ok{background:rgba(62,240,168,.16);border:1px solid var(--green);color:var(--green)}
.tag.wait{background:var(--glass);border:1px solid var(--line);color:var(--mut)}
.score-wrap{width:100%;max-width:900px;margin-inline:auto;display:flex;flex-direction:column;gap:9px}
.score-title{font-family:var(--mono);color:var(--mut);font-size:12px;letter-spacing:1.5px;text-align:center;margin-bottom:3px}
.srow{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:15px;background:var(--glass);border:1px solid var(--line)}
.srow .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;overflow:hidden;flex:0 0 auto;border:2px solid rgba(255,255,255,.14)}
.srow .av img{width:100%;height:100%;object-fit:cover}
.srow .snm{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sub{color:var(--mut);font-size:13px;font-family:var(--mono);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sc{font-family:var(--disp);font-weight:800;font-size:24px;min-width:2.4ch;text-align:right;color:#fff}
.pbtns{display:flex;gap:6px;flex-wrap:wrap}
.pbtn{border:0;border-radius:10px;padding:8px 12px;font-family:var(--ui);font-weight:700;font-size:13px;cursor:pointer;transition:.15s;background:var(--glass2);color:var(--ink);border:1px solid var(--line)}
.pbtn:hover{border-color:var(--cyan);color:#fff}
.pbtn.plus{background:linear-gradient(135deg,rgba(62,240,168,.24),rgba(47,240,255,.2));border-color:rgba(62,240,168,.4)}
.pbtn.minus{color:var(--mut)}
.board{width:100%;max-width:1000px;margin-inline:auto;display:flex;flex-direction:column;gap:13px}
.brow{display:grid;grid-template-columns:56px 60px 1fr auto;align-items:center;gap:16px;padding:14px 20px;border-radius:18px;background:var(--glass);border:1px solid var(--line);transition:.25s}
.brow.top{background:linear-gradient(100deg,rgba(255,45,155,.2),rgba(47,240,255,.08));box-shadow:0 12px 40px rgba(255,45,155,.22)}
.brow .rk{font-family:var(--disp);font-weight:800;font-size:26px;text-align:center;color:var(--mut)}
.brow.top .rk{color:var(--gold)}
.brow .bav{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;overflow:hidden;border:2px solid rgba(255,255,255,.16)}
.brow .bav img{width:100%;height:100%;object-fit:cover}
.bmid{min-width:0}
.bmid .bn{font-weight:700;font-size:clamp(16px,2vw,22px);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:14px;border-radius:999px;background:rgba(0,0,0,.32);overflow:hidden}
.bar-fill{height:100%;width:0;border-radius:999px;transition:width 1.2s cubic-bezier(.2,.9,.2,1);background:linear-gradient(90deg,var(--magenta),var(--violet));box-shadow:0 0 18px rgba(255,45,155,.5)}
.brow.top .bar-fill{background:linear-gradient(90deg,var(--gold),var(--magenta2));box-shadow:0 0 22px rgba(255,207,77,.6)}
.bpts{font-family:var(--disp);font-weight:800;font-size:clamp(26px,3.4vw,42px);color:#fff;min-width:2ch;text-align:right}
.podwrap{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.champ{font-family:var(--disp);font-weight:800;font-size:clamp(30px,5vw,60px);letter-spacing:-.5px;background:linear-gradient(100deg,var(--gold),var(--magenta2),var(--gold));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 4s linear infinite}
.pods{display:flex;align-items:flex-end;gap:clamp(10px,2.4vw,28px);justify-content:center;margin-top:14px;flex-wrap:wrap}
.pod{display:flex;flex-direction:column;align-items:center;gap:12px;width:clamp(140px,20vw,212px);opacity:0;animation:podin .6s cubic-bezier(.2,1.1,.3,1) both}
@keyframes podin{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1}}
.pod .pav{border-radius:50%;overflow:hidden;display:grid;place-items:center;box-shadow:0 12px 34px rgba(0,0,0,.55)}
.pod .pav img{width:100%;height:100%;object-fit:cover}
.pod .pn{font-family:var(--disp);font-weight:700;font-size:clamp(15px,1.8vw,20px);text-align:center;word-break:break-word}
.pod .pedestal{width:100%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;align-items:center;padding-top:16px;gap:6px}
.pedestal .medal{font-size:34px;filter:drop-shadow(0 0 10px rgba(255,207,77,.5))}
.pedestal .ppts{font-family:var(--disp);font-weight:800;font-size:clamp(24px,3vw,40px)}
.pedestal .plabel{font-family:var(--mono);font-weight:700;color:rgba(255,255,255,.8);font-size:11px;letter-spacing:1px}
.p1{animation-delay:1.1s}.p2{animation-delay:.55s}.p3{animation-delay:0s}
.p1 .pav{width:clamp(98px,12vw,142px);height:clamp(98px,12vw,142px);border:3px solid var(--gold)}
.p2 .pav{width:clamp(80px,10vw,112px);height:clamp(80px,10vw,112px);border:3px solid var(--silver)}
.p3 .pav{width:clamp(80px,10vw,112px);height:clamp(80px,10vw,112px);border:3px solid var(--bronze)}
.p1 .pedestal{height:clamp(152px,20vh,212px);background:linear-gradient(180deg,rgba(255,207,77,.34),rgba(255,207,77,.06));border:1px solid rgba(255,207,77,.5)}
.p2 .pedestal{height:clamp(112px,15vh,152px);background:linear-gradient(180deg,rgba(219,226,240,.26),rgba(219,226,240,.05));border:1px solid rgba(219,226,240,.4)}
.p3 .pedestal{height:clamp(88px,12vh,122px);background:linear-gradient(180deg,rgba(240,151,90,.3),rgba(240,151,90,.05));border:1px solid rgba(240,151,90,.4)}
.showbar{width:100%;max-width:900px;margin-inline:auto;display:flex;flex-direction:column;gap:12px;background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px}
.showbar .lbl{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--cyan);text-align:center}
.fxrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* ---------------- Sounds ---------------- */
var AC=null, soundOn=(localStorage.getItem("torneoIA_sound")!=="0");
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC&&AC.state==="suspended")AC.resume();}catch(e){}return AC;}
function tone(f,st,dur,type,vol){if(!soundOn)return;var c=ac();if(!c)return;try{var o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.value=f;var t=c.currentTime+st;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.14,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.start(t);o.stop(t+dur+0.03);}catch(e){}}

var sfxUp=function(){tone(660,0,.12,"triangle",.12);tone(990,.06,.12,"triangle",.10);};
var sfxDown=function(){tone(420,0,.14,"sine",.10);tone(300,.07,.14,"sine",.08);};
var sfxJoin=function(){tone(523,0,.11,"triangle",.12);tone(784,.08,.14,"triangle",.12);};
var sfxReveal=function(){sweep(1200,200,.26,.08,"sawtooth");tone(1320,.27,.18,"triangle",.12);};
var sfxWhoosh=function(){sweep(280,880,.2,.06,"sine");};
var sfxCorrect=function(){[523,659,784,1047].forEach(function(f,i){tone(f,i*0.08,.3,"triangle",.14);});};
var sfxWrong=function(){tone(300,0,.18,"sawtooth",.12);tone(200,.12,.28,"sawtooth",.12);tone(130,.30,.42,"sawtooth",.10);};
var sfxTick=function(){tone(1000,0,.03,"square",.05);};
var sfxTimeUp=function(){tone(880,0,.12,"square",.14);tone(880,.16,.12,"square",.14);tone(660,.34,.5,"square",.14);};
var sfxDrum=function(){if(!soundOn)return;for(var i=0;i<14;i++){tone(90+(i%2)*20,i*0.05,.05,"triangle",.10);}tone(760,.75,.3,"triangle",.14);};
var sfxFanfare=function(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,i*0.12,.32,"triangle",.14);});tone(1568,.62,.5,"triangle",.12);};
var sfxApplause=function(){if(!soundOn)return;var c=ac();if(!c)return;try{var dur=1.5,buf=c.createBuffer(1,Math.floor(c.sampleRate*dur),c.sampleRate),d=buf.getChannelData(0);for(var i=0;i<d.length;i++){var env=Math.min(1,i/(c.sampleRate*0.08))*Math.max(0,1-i/d.length);d[i]=(Math.random()*2-1)*env*0.55;}var src=c.createBufferSource();src.buffer=buf;var f=c.createBiquadFilter();f.type="bandpass";f.frequency.value=1800;f.Q.value=0.7;var g=c.createGain();g.gain.value=.5;src.connect(f);f.connect(g);g.connect(c.destination);src.start();}catch(e){}};

/* ---------------- Voice (TTS) ---------------- */
var voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[];}catch(e){voices=[];}}
if(window.speechSynthesis){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}}
function speak(text){
  if(!window.speechSynthesis)return;
  try{speechSynthesis.cancel();loadVoices();
    var u=new SpeechSynthesisUtterance(text);u.lang="es-ES";u.rate=1;u.pitch=1;u.volume=1;
    var v=voices.filter(function(x){return /es(-|_)/i.test(x.lang);});
    if(v.length){var pref=v.find(function(x){return /es-ES|es-US|es-MX|Spanish/i.test(x.lang+x.name);});u.voice=pref||v[0];}
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------------- FX overlay ---------------- */

function showFX(emoji,text,kind,sound){
  var fx=document.getElementById("fx");if(!fx)return;
  fx.innerHTML='<div class="fxcard '+(kind||"neutral")+'"><span class="fxemoji">'+emoji+'</span><span class="fxtxt">'+esc(text)+'</span></div>';
  if(!reduced&&app){app.classList.remove("shake");void app.offsetWidth;app.classList.add("shake");setTimeout(function(){if(app)app.classList.remove("shake");},520);}
  if(sound)sound();
  clearTimeout(fxTimeout);
  fxTimeout=setTimeout(function(){var card=fx.firstChild;if(card){card.classList.add("out");setTimeout(function(){fx.innerHTML="";},350);}else fx.innerHTML="";},1600);
}
function floatPts(x,y,txt,color){if(reduced)return;var d=document.createElement("div");d.className="floatpts";d.textContent=txt;d.style.left=(x-14)+"px";d.style.top=(y-14)+"px";if(color)d.style.color=color;document.body.appendChild(d);setTimeout(function(){d.remove();},1000);}
function scrambleReveal(text){
  var fx=document.getElementById("fx");if(!fx)return;
  if(!text){showFX("🎯","(escribe el prompt)","neutral");return;}
  fx.innerHTML='<div class="promptreveal" id="scr"></div>';var elp=document.getElementById("scr");
  var chars="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#@%&/*+";sfxReveal();clearTimeout(fxTimeout);
  if(reduced){elp.textContent=text;fxTimeout=setTimeout(function(){fx.innerHTML="";},3200);return;}
  var frame=0;var iv=setInterval(function(){frame++;var out="";for(var i=0;i<text.length;i++){if(i<frame/2)out+=text.charAt(i);else if(text.charAt(i)===" ")out+=" ";else out+=chars.charAt((Math.random()*chars.length)|0);}elp.textContent=out;if(frame/2>=text.length){clearInterval(iv);elp.textContent=text;fxTimeout=setTimeout(function(){fx.innerHTML="";},3200);}},40);
}

/* ---------------- Local DB shim (offline / preview) ---------------- */
function makeLocalDB(){
  var LKEY="torneoIA_net_v1",data;try{data=JSON.parse(localStorage.getItem(LKEY))||{};}catch(e){data={};}
  var subs=[];
  function persist(){try{localStorage.setItem(LKEY,JSON.stringify(data));}catch(e){}}
  function emit(){subs.slice().forEach(function(fn){try{fn();}catch(e){}});}
  function docSnap(path){return {id:path.split("/").pop(),exists:data[path]!=null,data:function(){return data[path];},metadata:{}};}
  function docRef(path){return {
    id:path.split("/").pop(),path:path,
    set:function(v){data[path]=v;persist();emit();return Promise.resolve();},
    update:function(v){var cur=data[path]||{};for(var k in v)cur[k]=v[k];data[path]=cur;persist();emit();return Promise.resolve();},
    delete:function(){delete data[path];persist();emit();return Promise.resolve();},
    get:function(){return Promise.resolve(docSnap(path));},
    onSnapshot:function(next){var fn=function(){next(docSnap(path));};subs.push(fn);setTimeout(fn,0);return function(){subs=subs.filter(function(x){return x!==fn;});};}
  };}
  function colSnap(prefix){var docs=[];for(var k in data){if(k.indexOf(prefix+"/")===0){var rest=k.slice(prefix.length+1);if(rest.indexOf("/")<0){(function(kk,id){docs.push({id:id,exists:true,data:function(){return data[kk];},metadata:{}});})(k,rest);}}}return {docs:docs,size:docs.length,empty:!docs.length,forEach:function(cb){docs.forEach(cb);},docChanges:function(){return [];},metadata:{}};}
  function colRef(prefix){return {
    path:prefix,
    doc:function(id){return docRef(prefix+"/"+(id||("d"+uid())));},
    add:function(v){var id="d"+uid();return docRef(prefix+"/"+id).set(v).then(function(){return {id:id};});},
    get:function(){return Promise.resolve(colSnap(prefix));},
    onSnapshot:function(next){var fn=function(){next(colSnap(prefix));};subs.push(fn);setTimeout(fn,0);return function(){subs=subs.filter(function(x){return x!==fn;});};},
    where:function(){return this;},orderBy:function(){return this;},limit:function(){return this;}
  };}
  return {doc:docRef,collection:colRef,_local:true};
}

function defaultGame(){return {phase:"lobby",round:1,r1:{items:[],idx:0},r2:{mid:null,note:"",revealed:false},r3:{brief:"Cliente: (elige uno real o inventado)\nReto: crea una pieza para una activación en punto de venta — un banner, un empaque o un post — y un eslogan.\nGana: mensaje claro + creatividad + qué tan vendible es."},timer:{endsAt:0,total:0,running:false}};}

/* ---------------- Writes ---------------- */
function saveGame(){if(!DB)return;DB.doc("game/state").set(game).catch(handleWErr);}
function saveScores(){if(!DB)return;DB.doc("game/scores").set({s:scores}).catch(handleWErr);}
function handleWErr(e){if(e&&(e.code==="invalid_argument"||e.code==="transform_error")){CANWRITE=false;render();}}
function addScore(id,delta,e){scores[id]=Math.max(0,(scores[id]||0)+delta);saveScores();if(delta>0){sfxUp();if(e)floatPts(e.clientX,e.clientY,"+"+delta);}else sfxDown();render();}

/* ---------------- Camera / images ---------------- */
function stopCam(){if(camStream){camStream.getTracks().forEach(function(t){t.stop();});camStream=null;}}
function startCam(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){flash("La cámara no está disponible. Sube una foto.");return;}navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false}).then(function(s){camStream=s;render();}).catch(function(){flash("No pudimos abrir la cámara. Sube una foto.");});}

function fileToSquare(file,side,q,cb){var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var c=document.createElement("canvas");c.width=side;c.height=side;var ctx=c.getContext("2d"),m=Math.min(img.width,img.height),sx=(img.width-m)/2,sy=(img.height-m)/2;ctx.drawImage(img,sx,sy,m,m,0,0,side,side);cb(c.toDataURL("image/jpeg",q));};img.onerror=function(){cb(null);};img.src=r.result;};r.readAsDataURL(file);}
function fileToWide(file,maxW,q,cb){var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var s=Math.min(1,maxW/img.width),w=Math.round(img.width*s),h=Math.round(img.height*s);var c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);cb(c.toDataURL("image/jpeg",q));};img.onerror=function(){cb(null);};img.src=r.result;};r.readAsDataURL(file);}
function flash(msg){var d=document.createElement("div");d.textContent=msg;d.style.cssText="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;background:#180d34;border:1px solid rgba(169,156,214,.3);color:#fff;padding:12px 20px;border-radius:13px;font-family:'Space Grotesk',sans-serif;font-size:14px;box-shadow:0 12px 40px rgba(0,0,0,.55);max-width:90vw;text-align:center";document.body.appendChild(d);setTimeout(function(){d.style.transition="opacity .4s";d.style.opacity="0";setTimeout(function(){d.remove();},420);},2800);}

/* ---------------- Timer (synced via game.timer) ---------------- */
function timerLeft(){var t=game.timer||{};if(t.running&&t.endsAt)return Math.max(0,Math.round((t.endsAt-Date.now())/1000));return t.total||0;}
function timerChip(){var t=game.timer||{};if(!t.running&&!((t.total||0)>0))return "";return '<div style="text-align:center;margin-top:-4px"><div class="tdisplay" id="tdisplay" style="font-size:clamp(26px,5vw,42px)">'+fmtT(timerLeft())+'</div></div>';}
function timerPaint(){var d=document.getElementById("tdisplay");var left=timerLeft();if(d){d.textContent=fmtT(left);d.classList.toggle("low",(game.timer&&game.timer.running)&&left<=10&&left>0);}
  if(game.timer&&game.timer.running){if(left<=10&&left>0&&lastTimerLeft!==left&&role==="host")sfxTick();if(left===0&&lastTimerLeft>0&&role==="host"){if(game.timer){game.timer.running=false;game.timer.total=0;}if(DB)DB.doc("game/state").set(game).catch(function(){});showFX("⏰","¡TIEMPO!","warn",sfxTimeUp);render();}}
  lastTimerLeft=left;
}
setInterval(timerPaint,300);
function hostTimerStart(sec){game.timer={endsAt:Date.now()+sec*1000,total:sec,running:true};saveGame();render();}
function hostTimerToggle(){var t=game.timer||{};if(t.running){t.total=timerLeft();t.running=false;}else if((t.total||0)>0){t.endsAt=Date.now()+t.total*1000;t.running=true;}game.timer=t;saveGame();render();}
function hostTimerReset(){game.timer={endsAt:0,total:0,running:false};saveGame();render();}

/* ================= RENDER ================= */
function render(){
  if(!dbReady){app.innerHTML=connectingView();return;}
  var ae=document.activeElement,aid=ae&&ae.id,aval=null,asel=null;
  if(aid&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA")){aval=ae.value;try{asel=[ae.selectionStart,ae.selectionEnd];}catch(e){}}
  var body = role==="host" ? hostRender() : teamRender();
  app.innerHTML = topbar()+body+modalView();
  if(aid){var re=document.getElementById(aid);if(re&&(re.tagName==="INPUT"||re.tagName==="TEXTAREA")){if(aval!=null&&aval!==re.value)re.value=aval;try{re.focus();if(asel&&re.setSelectionRange)re.setSelectionRange(asel[0],asel[1]);}catch(e){}}}
  requestAnimationFrame(function(){document.querySelectorAll(".bar-fill[data-w]").forEach(function(b){b.style.width=b.dataset.w;});});
  timerPaint();
  if(camStream){var v=document.getElementById("cam");if(v&&!v.srcObject){v.srcObject=camStream;v.play();}}
}
function connectingView(){return '<div class="stage"><div class="center"><div class="pill hot">CONECTANDO…</div><h1 class="hero-title" style="font-size:clamp(40px,9vw,90px)">Torneo de IA</h1><p class="hero-sub">Enlazando con la sala…</p></div></div>';}

function leaderboard(){

  var s=sortedTeams(),max=Math.max(1,scoreOf(s[0].id)),med=["🥇","🥈","🥉"];
  return '<div class="board">'+s.map(function(t,i){var w=Math.max(6,Math.round(scoreOf(t.id)/max*100));return '<div class="brow'+(i===0&&scoreOf(t.id)>0?" top holo":"")+'"><div class="rk">'+(i<3?med[i]:(i+1))+'</div>'+avatarHTML(t,"bav")+'<div class="bmid"><div class="bn">'+esc(t.name)+'</div><div class="track"><div class="bar-fill" data-w="'+w+'%"></div></div></div><div class="bpts">'+scoreOf(t.id)+'</div></div>';}).join("")+'</div>';

function hostR1(){
  var items=game.r1.items,it=items[game.r1.idx];
  var head='<div class="round-head"><div class="pill hot">RETO 1</div><h2>¿Real o IA?</h2><p>Presenta el reto con voz, pon la imagen y deja que cada equipo vote desde su computador. Al revelar, se asignan los puntos solos.</p>'+
    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px"><button class="btn btn-cyan" data-action="say" data-r="1">🎙️ Presentar reto (voz)</button><button class="btn btn-ghost" data-action="r1Setup">🖼️ Preparar imágenes</button><button class="btn btn-ghost" data-action="r1Quick">＋ Pregunta rápida</button></div></div>';
  var main;
  if(!items.length){
    main='<div class="qwrap"><div class="qimg"><div class="noimg">Carga las imágenes en <b>Preparar imágenes</b>.<br>O usa <b>Pregunta rápida</b> si las muestras por otro lado.</div></div></div>';
  }else{
    var m=it.mid?media[it.mid]:null;
    var imgHTML=m?'<img src="'+m+'" alt="">':'<div class="noimg">Muestra la imagen en la sala.<br><span class="kbd">(sin imagen cargada)</span></div>';
    var mid="";
    var voters=teams.filter(function(t){return voteFor(it.id,t.id);}).length;
    if(!it.revealed){
      mid='<div class="tag wait">🗳️ '+voters+' / '+teams.length+' equipos han votado</div>';
      if(scanning)mid+='<div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:8px"><div class="scanlabel">◇ ANALIZANDO IMAGEN…</div><div class="scanbar"><i></i></div></div>';
      else if(it.answer)mid+='<div style="margin-top:10px"><button class="btn btn-primary btn-lg" data-action="r1Reveal">🔍 Analizar y revelar</button></div>';
      else mid+='<div class="reveal ia" style="font-size:clamp(20px,3vw,30px);color:var(--mut);margin-top:10px">Esta pregunta no tiene respuesta marcada</div>';
    }else{
      if(it.answer){mid='<div class="reveal '+(it.answer==="REAL"?"real":"ia")+'">'+(it.answer==="REAL"?"REAL ✔":"IA 🤖")+'</div>';if(it.pista)mid+='<div class="pista">'+esc(it.pista)+'</div>';}
      // per-team result
      mid+='<div class="score-wrap" style="margin-top:12px"><div class="score-title">RESULTADO DE ESTA IMAGEN</div>'+teams.map(function(t){var vt=voteFor(it.id,t.id);var ok=vt&&vt.value===it.answer;var sub=vt?(vt.value+(ok?" ✔ +1":" ✗ falló")):"sin voto";return '<div class="srow"><div style="color:'+(ok?"var(--green)":"var(--faint)")+';font-size:20px;width:24px;text-align:center">'+(ok?"✔":"·")+'</div>'+avatarHTML(t,"av")+'<div class="snm">'+esc(t.name)+'</div><div class="sub">'+sub+'</div><div class="sc">'+scoreOf(t.id)+'</div></div>';}).join("")+'</div>';
    }
    var nav='<div class="qnav" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px"><button class="btn btn-ghost btn-sm" data-action="r1Prev"'+(game.r1.idx===0?" disabled":"")+'>◂ Anterior</button><button class="btn btn-cyan btn-sm" data-action="r1Next"'+(game.r1.idx>=items.length-1?" disabled":"")+'>Siguiente imagen ▸</button></div>';
    main='<div class="qwrap"><div class="qimg"><div class="qn">IMAGEN '+(game.r1.idx+1)+' / '+items.length+'</div>'+imgHTML+'</div>'+mid+nav+'</div>';
  }
  return '<div class="stage">'+connWarn()+head+goBar(1)+main+miniBoard()+showbar()+hostFoot(1)+'</div>';
}

  var reveal='<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;width:100%;max-width:640px"><input class="input" id="r2note" placeholder="Escribe el prompt real (para revelarlo)" value="'+esc(game.r2.note||"")+'"><button class="btn btn-cyan btn-sm" data-action="revealPrompt">Revelar prompt real</button></div>';
  return '<div class="stage">'+connWarn()+head+goBar(2)+'<div class="qwrap"><div class="target">'+tgt+'</div>'+(m?'<label class="btn btn-ghost btn-sm" style="cursor:pointer">Cambiar imagen<input type="file" accept="image/*" data-file="r2target" style="display:none"></label>':'')+reveal+panel+'</div>'+miniBoard()+showbar()+hostFoot(2)+'</div>';

  var head='<div class="round-head"><div class="pill hot">RETO 3</div><h2>Crea el creativo</h2><p>Los equipos crean su pieza y suben su eslogan (y foto) desde su computador. Al final presentan y tú asignas los puntos.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px"><button class="btn btn-cyan" data-action="say" data-r="3">🎙️ Presentar reto (voz)</button><button class="btn btn-ghost" data-action="briefEdit">✎ Editar brief</button></div></div>';

  if(!CANWRITE){return '<div class="stage"><div class="center"><div class="pill hot">FALTA UN PERMISO</div><h2 class="round-head" style="font-family:var(--disp);font-size:clamp(26px,5vw,44px)">Pídele acceso al anfitrión</h2><p class="hero-sub">Este link está compartido en modo solo lectura. El anfitrión debe compartirlo con permiso de <b>edición</b> (o abrir el acceso a la organización) para que puedas registrar tu equipo.</p></div></div>';}

  var p=game.phase, mt=myTeam();
  if(p==="lobby")return teamWait("¡Estás dentro, "+mt.name+"! 🎉","Mira la pantalla principal. El torneo está por comenzar.");

  if(p==="r2")return teamR2();
  if(p==="r3")return teamR3();

function teamWait(title,sub){return '<div class="stage"><div class="center"><div class="tag ok">CONECTADO</div><h1 class="hero-title" style="font-size:clamp(34px,7vw,74px)">'+esc(title)+'</h1><p class="hero-sub">'+esc(sub)+'</p>'+(teams.length?'<div style="margin-top:8px"><span class="kbd">'+teams.length+' EQUIPOS EN LA SALA</span></div>':'')+'</div></div>';}
function teamR1(){
  var items=game.r1.items,it=items[game.r1.idx];
  if(!it)return teamWait("Reto 1","Espera a que el anfitrión ponga la primera imagen.");
  var m=it.mid?media[it.mid]:null;
  var img=m?'<img src="'+m+'" alt="">':'<div class="noimg">👀 Mira la imagen en la pantalla principal</div>';
  var myV=voteFor(it.id,myId);
  var body;
  if(it.revealed){
    var ok=myV&&myV.value===it.answer;
    body='<div class="reveal '+(it.answer==="REAL"?"real":"ia")+'">'+(it.answer==="REAL"?"REAL":"ERA IA")+'</div>'+(myV?('<div class="tag '+(ok?"ok":"wait")+'" style="margin-top:8px">'+(ok?"¡Acertaste! +1":"Fallaste esta")+'</div>'):'<div class="tag wait" style="margin-top:8px">No alcanzaste a votar</div>');
  }else{
    body='<div class="vote2"><button class="votebtn real'+(myV&&myV.value==="REAL"?" sel":"")+'" data-action="vote" data-q="'+it.id+'" data-v="REAL"><span class="ic">🌍</span>REAL</button><button class="votebtn fake'+(myV&&myV.value==="FAKE"?" sel":"")+'" data-action="vote" data-q="'+it.id+'" data-v="FAKE"><span class="ic">🤖</span>IA</button></div>'+(myV?'<div class="tag ok" style="margin-top:6px">Voto enviado: '+myV.value+' · puedes cambiarlo</div>':'<div class="tag wait" style="margin-top:6px">Elige una opción</div>');
  }
  return '<div class="stage"><div class="round-head"><div class="pill hot">RETO 1 · IMAGEN '+(game.r1.idx+1)+'</div><h2>¿Real o IA?</h2></div>'+timerChip()+'<div class="qwrap"><div class="qimg">'+img+'</div>'+body+'</div></div>';
}
function teamR2(){
  var m=game.r2.mid?media[game.r2.mid]:null;var img=m?'<img src="'+m+'" alt="">':'<div class="noimg">👀 Mira la imagen objetivo en la pantalla</div>';

  copyLink:function(){var i=document.getElementById("joinlink");if(i){try{navigator.clipboard.writeText(i.value);flash("Link copiado ✔");}catch(e){i.select();flash("Selecciona y copia el link");}}},
  hostGo:function(el){hostView=el.dataset.v;if(hostView.charAt(0)==="r"&&hostView.length===2){game.phase=hostView;game.round=parseInt(hostView.charAt(1),10);saveGame();}else if(hostView==="board"){game.phase="board";saveGame();}else if(hostView==="podium"){game.phase="podium";saveGame();setTimeout(confettiBurst,900);setTimeout(sfxFanfare,700);}else if(hostView==="lobby"){game.phase="lobby";saveGame();}render();},
  startR1:function(){ac();hostView="r1";game.phase="r1";game.round=1;saveGame();render();actions.say({dataset:{r:"1"}});},
  reset:function(){if(confirm("¿Reiniciar el torneo? Se borran equipos y puntajes para todos.")){game=defaultGame();scores={};teams.slice().forEach(function(t){if(DB)DB.doc("teams/"+t.id).delete().catch(function(){});});Object.keys(answers).forEach(function(k){if(DB)DB.doc("answers/"+k).delete().catch(function(){});});Object.keys(media).forEach(function(k){if(DB)DB.doc("media/"+k).delete().catch(function(){});});saveGame();saveScores();hostView="lobby";render();}},

  say:function(el){var r=el.dataset.r;var t=timerLeft();var mins=game.timer&&game.timer.total?Math.round(game.timer.total/60):0;var txt;
    if(r==="1")txt="¡Bienvenidos al Reto uno: Real o Inteligencia Artificial! Cada equipo verá una serie de imágenes en su pantalla. Deben decidir, con cuidado, si son reales o generadas por inteligencia artificial. Cada acierto suma un punto. Presten mucha atención... porque la IA sabe engañar. ¡Que comience el reto!";
    else if(r==="2")txt="Reto dos: Adivina el prompt. Verán una imagen creada por inteligencia artificial. Su misión es escribir el prompt, es decir, las instrucciones, que creen que la generaron. El equipo más preciso se lleva el mayor puntaje. ¡Piensen como una máquina!";
    else txt="Reto tres: Crea el creativo. Cada equipo usará inteligencia artificial para crear una pieza publicitaria para una activación, con su propio eslogan. Al final, presentarán su idea y sumarán puntos. ¡Que gane la creatividad!";
    speak(txt);},

  // R1
  r1Setup:function(){modal={type:"setup",tab:"IA"};render();},
  r1Quick:function(){game.r1.items.push({id:uid(),mid:null,answer:null,pista:"",revealed:false,scored:false});game.r1.idx=game.r1.items.length-1;saveGame();render();},
  r1Prev:function(){if(game.r1.idx>0){game.r1.idx--;saveGame();render();}},
  r1Next:function(){if(game.r1.idx<game.r1.items.length-1){game.r1.idx++;sfxWhoosh();saveGame();render();}},
  r1Reveal:function(){if(scanning)return;scanning=true;sfxWhoosh();render();setTimeout(function(){scanning=false;var it=game.r1.items[game.r1.idx];if(!it){render();return;}it.revealed=true;if(!it.scored){it.scored=true;teams.forEach(function(t){var v=voteFor(it.id,t.id);if(v&&v.value===it.answer)scores[t.id]=(scores[t.id]||0)+1;});saveScores();}saveGame();render();if(it.answer){if(it.answer==="REAL")showFX("🌍","REAL","neutral",sfxReveal);else showFX("🤖","¡ERA IA!","bad",sfxReveal);}},1650);},
  modalClose:function(){modal=null;render();},
  modalTab:function(el){if(modal)modal.tab=el.dataset.tab;render();},
  itemDel:function(el){var id=el.dataset.id;var it=game.r1.items.find(function(x){return x.id===id;});if(it&&it.mid&&DB)DB.doc("media/"+it.mid).delete().catch(function(){});game.r1.items=game.r1.items.filter(function(x){return x.id!==id;});if(game.r1.idx>=game.r1.items.length)game.r1.idx=Math.max(0,game.r1.items.length-1);saveGame();render();},

  // R2/R3 host
  award:function(el,e){addScore(el.dataset.id,parseInt(el.dataset.d,10),e);},
  revealPrompt:function(){var i=document.getElementById("r2note");if(i){game.r2.note=i.value;saveGame();}scrambleReveal(game.r2.note);},
  briefEdit:function(){var cur=game.r3.brief;var nv=prompt("Edita el brief del Reto 3:",cur);if(nv!=null){game.r3.brief=nv;saveGame();render();}},

  // timer + fx
  tset:function(el){hostTimerStart(parseInt(el.dataset.sec,10));},
  ttoggle:function(){hostTimerToggle();},
  treset:function(){hostTimerReset();},
  goMins:function(el){goMins=parseInt(el.dataset.m,10)||5;render();},
  giveGo:function(el){var c=document.getElementById("goCustom");var mins=c&&c.value?parseInt(c.value,10):goMins;if(!mins||mins<1)mins=5;goMins=mins;hostTimerStart(mins*60);showFX("▶","¡GO!","neutral",sfxWhoosh);speak("¡Arrancamos! Tienen "+mins+(mins===1?" minuto":" minutos")+" a partir de ahora. ¡Mucha suerte!");},
  fx:function(el){var k=el.dataset.fx;if(k==="correct")showFX("✅","¡CORRECTO!","good",sfxCorrect);else if(k==="wrong")showFX("❌","¡INCORRECTO!","bad",sfxWrong);else if(k==="applause")showFX("🎉","¡ESO!","good",sfxApplause);else if(k==="uuh")showFX("😱","¡UUUH!","warn",sfxWrong);else if(k==="lose")showFX("💀","¡PERDISTE!","bad",sfxWrong);else if(k==="win")showFX("🏆","¡GANADOR!","warn",sfxCorrect);else if(k==="drum")showFX("🥁","REDOBLE…","neutral",sfxDrum);},

  // camera / photo
  camOn:function(){startCam();},camCancel:function(){stopCam();render();},capture:function(){capture();},retake:function(){draft.photo=null;render();},

  // team
  joinTeam:function(){var n=(draft.name||"").trim();if(!n){flash("Ponle un nombre a tu equipo");return;}ac();var doc={id:myId,name:n,photo:draft.photo||null,color:colorFor(myId),emoji:emojiFor(myId),joinedAt:Date.now()};if(DB)DB.doc("teams/"+myId).set(doc).then(function(){sfxJoin();}).catch(function(e){handleWErr(e);flash("No se pudo registrar. Puede faltar permiso de edición.");});draft={name:"",photo:null};stopCam();render();},
  addLocalTeam:function(){draft={name:"",photo:null};forcedRole=null;/* reuse register via team view */ hostView="lobby";modal=null;/* open a lightweight register */ openLocalRegister();},
  vote:function(el){var q=el.dataset.q,v=el.dataset.v;if(DB)DB.doc("answers/v_"+q+"_"+myId).set({kind:"vote",qid:q,teamId:myId,value:v,ts:Date.now()}).catch(handleWErr);sfxUp();render();},
  sendPrompt:function(){var i=document.getElementById("promptIn");var tx=i?i.value.trim():"";if(!tx){flash("Escribe tu prompt");return;}if(DB)DB.doc("answers/p_"+myId).set({kind:"prompt",teamId:myId,text:tx,ts:Date.now()}).catch(handleWErr);sfxUp();flash("¡Prompt enviado! ✔");render();},
  sendCreative:function(){var i=document.getElementById("sloganIn");var tx=i?i.value.trim():"";var doc={kind:"creative",teamId:myId,text:tx,ts:Date.now()};if(draft.photo)doc.photo=draft.photo;if(DB)DB.doc("answers/c_"+myId).set(doc).catch(handleWErr);sfxUp();flash("¡Entrega enviada! ✔");draft.photo=null;render();}
};

actions.addLocalCancel=function(){draft={name:"",photo:null};stopCam();forcedRole=null;render();};

/* ---------------- Delegation ---------------- */
app.addEventListener("click",function(e){var el=e.target.closest("[data-action]");if(!el)return;var a=el.dataset.action;if(a==="modalClose"&&e.target!==el)return;if(el.tagName==="A")e.preventDefault();
  if(forcedRole==="__reg"){ // local register special handlers
    if(a==="camOn"){startCam();return;}if(a==="camCancel"){stopCam();render_localReg();return;}if(a==="capture"){capture();return;}if(a==="retake"){draft.photo=null;render_localReg();return;}
  }
  if(actions[a])actions[a](el,e);
});
app.addEventListener("change",function(e){var f=e.target;if(!(f.dataset&&f.dataset.file))return;var kind=f.dataset.file,file=f.files&&f.files[0];if(!file)return;
  if(kind==="teamphoto")fileToSquare(file,260,0.72,function(d){if(d){draft.photo=d;stopCam();if(forcedRole==="__reg")render_localReg();else render();}else flash("No se pudo leer la imagen");});
  else if(kind==="r3photo")fileToSquare(file,320,0.7,function(d){if(d){draft.photo=d;render();}});
  else if(kind==="r2target")fileToWide(file,760,0.62,function(d){if(!d)return;var mid="m"+uid();media[mid]=d;if(DB)DB.doc("media/"+mid).set({d:d}).catch(handleWErr);game.r2.mid=mid;saveGame();render();});
  else if(kind==="r1item"){var tab=(modal&&modal.tab)||"IA";var pista=(document.getElementById("pistaInput")||{}).value||"";fileToWide(file,760,0.62,function(d){if(!d)return;var mid="m"+uid();media[mid]=d;if(DB)DB.doc("media/"+mid).set({d:d}).catch(handleWErr);game.r1.items.push({id:uid(),mid:mid,answer:tab,pista:pista,revealed:false,scored:false});saveGame();render();});}
  f.value="";
});
app.addEventListener("input",function(e){if(e.target.id==="teamName")draft.name=e.target.value;else if(e.target.id==="r2note")game.r2.note=e.target.value;});

function tickClock(){var el=document.getElementById("clock");if(el){var d=new Date();el.textContent=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+":"+("0"+d.getSeconds()).slice(-2);}}
setInterval(tickClock,1000);

/* ---------------- Background particles ---------------- */
function initBG(){if(reduced)return;var c=document.getElementById("bg");if(!c)return;var ctx=c.getContext("2d");function size(){c.width=innerWidth;c.height=innerHeight;}size();addEventListener("resize",size);var P=[];for(var i=0;i<70;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.8+.4,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,a:Math.random()*.5+.18});(function loop(){ctx.clearRect(0,0,c.width,c.height);for(var i=0;i<P.length;i++){var p=P[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=c.width;if(p.x>c.width)p.x=0;if(p.y<0)p.y=c.height;if(p.y>c.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fillStyle="rgba(180,200,255,"+p.a+")";ctx.fill();}requestAnimationFrame(loop);})();}
function confettiBurst(){if(reduced)return;var c=document.getElementById("confetti");if(!c)return;var ctx=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;var cols=["#ff2d9b","#2ff0ff","#ffcf4d","#ff6ec2","#a78bfa","#3ef0a8"],parts=[];function spawn(cx){for(var i=0;i<110;i++)parts.push({x:cx,y:innerHeight*0.32,vx:(Math.random()-.5)*17,vy:Math.random()*-19-6,g:0.4+Math.random()*0.35,s:6+Math.random()*10,rot:Math.random()*6.28,vr:(Math.random()-.5)*.5,col:cols[(Math.random()*cols.length)|0],life:0,shape:Math.random()<.3?"c":"r"});}spawn(innerWidth*0.3);spawn(innerWidth*0.7);var start=performance.now();(function frame(t){ctx.clearRect(0,0,c.width,c.height);var alive=false;for(var i=0;i<parts.length;i++){var p=parts[i];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life++;if(p.y<c.height+50)alive=true;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.max(0,1-p.life/210);ctx.fillStyle=p.col;if(p.shape==="c"){ctx.beginPath();ctx.arc(0,0,p.s*0.5,0,6.283);ctx.fill();}else ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62);ctx.restore();}if(alive&&t-start<4800)requestAnimationFrame(frame);else ctx.clearRect(0,0,c.width,c.height);})(start);}

function subDoc(path,apply){DB.doc(path).onSnapshot(function(s){apply(s.exists?s.data():null);render();},function(){});}
function subCol(path,apply){DB.collection(path).onSnapshot(function(s){apply(s.docs);render();},function(){});}

async function init(){
  if(fbConfigured()&&window.firebase){
    try{ if(!(firebase.apps&&firebase.apps.length))firebase.initializeApp(FIREBASE_CONFIG); DB=firebase.firestore(); online=true; }
    catch(e){ DB=makeLocalDB(); online=false; }
  } else { DB=makeLocalDB(); online=false; }
  myId=localStorage.getItem("torneoIA_myid")||("g"+uid());try{localStorage.setItem("torneoIA_myid",myId);}catch(e){}
  var h=(location.hash||"").toLowerCase();
  var isAdmin=(h.indexOf("admin")>=0||h.indexOf("host")>=0)&&h.indexOf("team")<0;
  role = isAdmin ? "host" : "team";
  CANWRITE=true;
  // subscriptions
  subDoc("game/state",function(v){game=v||defaultGame();if(role==="host"&&game.phase)hostView=game.phase;});
  subDoc("game/scores",function(v){scores=(v&&v.s)||{};});
  subCol("teams",function(docs){teams=docs.map(function(d){var b=d.data()||{};b.id=b.id||d.id;return b;});});
  subCol("answers",function(docs){var m={};docs.forEach(function(d){m[d.id]=d.data();});answers=m;});
  subCol("media",function(docs){var m={};docs.forEach(function(d){var b=d.data();if(b&&b.d)m[d.id]=b.d;});media=m;});
  dbReady=true;render();
}
init();
})();
</script>
</body>
</html>
